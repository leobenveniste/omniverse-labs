name: vuelo_controlado_staff
description: "App de gestión de staff y fichas de casos para Fundación Vuelo Controlado."
publish_to: 'none'

version: 1.0.27+30

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  intl: ^0.20.2
  uuid: ^4.6.0
  shared_preferences: ^2.5.6
  path_provider: ^2.1.6
  csv: ^8.0.0
  share_plus: ^13.3.1
  http: ^1.6.0
  qr_flutter: ^4.1.0
  image_picker: ^1.1.2
  firebase_core: ^5.1.0
  cloud_firestore: ^7.1.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
