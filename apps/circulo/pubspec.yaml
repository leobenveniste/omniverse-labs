name: circulo
description: "Red social para hacer amigos en grupos de 4 a 10 personas con Material 3 Expressive."
publish_to: 'none'

version: 1.0.0+9

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  intl: ^0.20.2
  uuid: ^4.6.0
  shared_preferences: ^2.5.6
  image_picker: ^1.1.2
  firebase_core: ^5.1.0
  cloud_firestore: ^7.1.0
  google_sign_in: ^6.2.2
  crypto: ^3.0.6
  url_launcher: ^6.3.3
  share_plus: ^13.3.1
  local_auth: ^2.3.0
  in_app_purchase: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
